name: Verify deployed training guardrail
on:
  workflow_dispatch:
  push:
    branches: [stretch-v0.2]
    paths: ['scripts/check_live_guardrail.py', '.github/workflows/live-guardrail.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install httpx pydantic
      - run: python -m scripts.check_live_guardrail
      - uses: actions/upload-artifact@v4
        with:
          name: live-guardrail
          path: results/stretch/live-guardrail.json

name: Validate FOCUS against official rules
on:
  workflow_dispatch:
  push:
    branches: [complete-v2, main]
    paths: ['packages/focus/**', 'scripts/focus_fixture.py', 'scripts/audit_focus.py', '.github/workflows/focus-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - run: uv run python -m scripts.focus_fixture
      - name: Install official validator in an isolated environment
        run: |
          python -m venv .focus-validator
          .focus-validator/bin/pip install focus-validator==2.2.1 pyarrow==20.0.0
          mkdir -p focus_validator/rules
          curl --fail --location https://raw.githubusercontent.com/finopsfoundation/focus_validator/v2.2.1/focus_validator/rules/currency_codes.csv --output focus_validator/rules/currency_codes.csv
      - name: Record supported versions and validate both datasets
        run: |
          mkdir -p results/focus
          .focus-validator/bin/focus-validator --supported-versions > results/focus/versions.txt 2>&1
          cat results/focus/versions.txt
          for dataset in CostAndUsage ContractCommitment; do
            file="tmp/focus-fixture/$dataset.parquet"
            if [ "$dataset" = "CostAndUsage" ]; then file="tmp/focus-fixture/CostAndUsage-1.3.parquet"; fi
            .focus-validator/bin/focus-validator --data-file "$file" --validate-version 1.3.0.1 --focus-dataset "$dataset" --applicability-criteria ACCOUNT_NAMING_SUPPORTED,AVAILABILITY_ZONE_SUPPORTED,COMMITMENT_DISCOUNT_SUPPORTED,CONTRACT_COMMITMENTS_SUPPORTED,DATA_GENERATOR_SPLIT_COST_ALLOCATION_SUPPORTED,MULTIPLE_PRICING_CATEGORIES_SUPPORTED,NEGOTIATED_PRICING_SUPPORTED,PUBLIC_PRICE_LIST_SUPPORTED,USAGE_MEASUREMENT_SUPPORTED,UNIT_PRICING_SUPPORTED,SUB_ACCOUNT_SUPPORTED,BILLING_BASED_ON_PROVISIONED_RESOURCES_SUPPORTED,RESOURCE_TYPE_ASSIGNMENT_SUPPORTED,REGION_SUPPORTED,TAGGING_SUPPORTED --output-type unittest --output-destination "results/focus/$dataset.xml" > "results/focus/$dataset.log" 2>&1 || { cat "results/focus/$dataset.log"; exit 1; }
            tail -n 20 "results/focus/$dataset.log"
          done
      - name: Audit exact upstream exceptions and reject new violations
        run: uv run python -m scripts.audit_focus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-focus-validation
          path: |
            results/focus/
            tmp/focus-fixture/

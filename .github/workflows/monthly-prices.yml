name: Collect month-later price observation
on:
  workflow_dispatch:
  schedule:
    - cron: '15 14 1 * *'
permissions:
  contents: read
concurrency:
  group: monthly-price-observation
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.collect_monthly_prices
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: monthly-price-candidate-${{ github.run_id }}
          path: |
            results/monthly-price-status.json
            results/expanded-price-candidate.json
            tmp/expanded-price-evidence/
          if-no-files-found: error
          retention-days: 90

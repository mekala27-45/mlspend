name: Build full expanded study
on:
  workflow_dispatch:
  push:
    branches: [complete-v2]
    paths: ['scripts/build_expanded.py', 'scripts/check_expanded_reproducibility.py', '.github/workflows/expanded-build.yml', 'packages/evaluation/expanded.py', 'packages/expansion/**', 'packages/focus/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --group dev
      - name: Re-derive full study under two independent hash seeds
        run: uv run python -m scripts.check_expanded_reproducibility
      - name: Recalculate the delivered finance workbook
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc
          uv run python -m scripts.verify_workbook
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: expanded-full-study
          path: |
            results/expanded/
            exports/expanded/
            data/expanded/generation.json
            data/expanded/quarantine.json
            data/expanded/sealed/
            warehouse-expanded/target/run_results.json
      - name: Preserve generated results on evidence branch
        env:
          EVIDENCE_BRANCH: evidence/expanded-build-${{ github.run_id }}
        run: |
          git fetch origin main
          git switch -c "$EVIDENCE_BRANCH" origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/expanded/
          git commit -m "data: record full expanded study and counterfactual scores"
          git push origin "$EVIDENCE_BRANCH"

name: Preserve resolved Python dependencies
on:
  workflow_dispatch:
  push:
    branches: [complete-v2]
    paths: ['.github/workflows/lock-dependencies.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv lock
      - uses: actions/upload-artifact@v4
        with:
          name: python-dependency-lock
          path: uv.lock
      - name: Preserve lock on evidence branch
        env:
          EVIDENCE_BRANCH: evidence/python-lock-${{ github.run_id }}
        run: |
          git switch -c "$EVIDENCE_BRANCH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock
          git commit -m "build: freeze resolved Python dependency graph"
          git push origin "$EVIDENCE_BRANCH"

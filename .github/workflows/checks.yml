name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mlspend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MLSPEND_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/mlspend
      PGPASSWORD: ci-only-ephemeral-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --group dev
      - name: Build data and reports
        run: uv run python -m scripts.build
      - name: Static checks
        run: |
          uv run ruff check packages scripts tests
          uv run ruff format --check --diff packages scripts tests
          uv run mypy packages
          uv run python -m scripts.check
          uv run python -m scripts.check_diff
          uv run python -m scripts.build_stretch --check
          node scripts/validate_palette.js --config config/palette.json > results/palette-validation.json
          node --check web/app.js
          node --test tests/web-client.test.cjs
      - name: Unit and integration tests
        env:
          DATABASE_URL: ${{ env.MLSPEND_TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run pytest --cov=packages --cov-report=json:results/coverage.json --junitxml=results/tests-ci.xml
      - name: Execute dead-end notebooks
        run: uv run pytest --nbmake notebooks
      - name: Validate repository skills with the reference implementation
        run: |
          python -m venv .skill-validator
          .skill-validator/bin/pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          for skill in .claude/skills/*; do .skill-validator/bin/skills-ref validate "$skill"; done
      - name: HTTP persistence check
        run: uv run python -m scripts.check_persistence
      - name: Port-80 container and independent PostgreSQL persistence
        env:
          DATABASE_URL: ${{ env.MLSPEND_TEST_DATABASE_URL }}
          MLSPEND_SALT: ci-container-only-random-salt-not-a-credential
          MLSPEND_CONTAINER_URL: http://127.0.0.1:8080
        run: |
          docker build -f Dockerfile.vercel -t mlspend-check .
          docker run -d --name mlspend-check -p 8080:80 --add-host host.docker.internal:host-gateway --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --sysctl net.ipv4.ip_unprivileged_port_start=0 -e DATABASE_URL=postgresql://postgres@host.docker.internal:5432/mlspend -e PGPASSWORD -e MLSPEND_SALT mlspend-check
          test "$(docker exec mlspend-check id -u)" = "10001"
          if docker exec mlspend-check touch /app/should-not-write; then exit 1; fi
          uv run python -m scripts.check_container
      - name: dbt models and data tests
        working-directory: warehouse
        run: uv run --project .. dbt build --project-dir . --profiles-dir .
      - name: Repeat builds with different hash seeds
        run: uv run python -m scripts.check_reproducibility
      - name: Preserve check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-evidence
          path: |
            results/
            warehouse/target/run_results.json
          if-no-files-found: error

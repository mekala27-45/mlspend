name: Fetch actuals and close a completed forecast period
on:
  schedule:
    - cron: '17 6 2 * *'
  workflow_dispatch:
    inputs:
      period:
        description: Completed month, YYYY-MM; blank selects the previous month
        required: false
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.MLSPEND_CLOSE_DATABASE_URL }}
      MLSPEND_SALT: ${{ secrets.MLSPEND_CLOSE_SALT }}
      PERIOD: ${{ inputs.period }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - name: Fetch completed-period public usage and score only complete matching actuals
        run: uv run python -m scripts.scheduled_close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: period-close-evidence
          path: results/period-close/

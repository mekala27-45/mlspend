name: Collect expanded price evidence
on:
  workflow_dispatch:
  push:
    branches: [complete-v2]
    paths: ['scripts/fetch_expanded_prices.py', '.github/workflows/expanded-prices.yml']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx
      - run: python -m scripts.fetch_expanded_prices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-provider-evidence
          path: |
            results/expanded-price-candidate.json
            tmp/expanded-price-evidence/
      - name: Save candidate on a separate evidence branch
        env:
          EVIDENCE_BRANCH: evidence/expanded-prices-${{ github.run_id }}
        run: |
          git switch -c "$EVIDENCE_BRANCH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/expanded-price-candidate.json
          git commit -m "data: record expanded public price candidate for review"
          git push origin "$EVIDENCE_BRANCH"

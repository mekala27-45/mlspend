name: Issue and close a registered simulated month
on:
  schedule:
    - cron: '43 6 2 * *'
  workflow_dispatch:
  push:
    branches: [complete-v2]
    paths: ['.github/workflows/prospective-close.yml']
permissions:
  contents: read
concurrency:
  group: prospective-close
  cancel-in-progress: false
jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.MLSPEND_CLOSE_DATABASE_URL }}
      MLSPEND_SALT: ${{ secrets.MLSPEND_CLOSE_SALT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - name: Require the prior registration commit
        run: git merge-base --is-ancestor 0308a7a07398b9b7f587d852b0e8ff8abf2df7b8 HEAD
      - name: Issue live forecasts and independently read unscored records
        run: uv run python -m packages.evaluation.prospective issue --output results/prospective/issued.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prospective-issued
          path: results/prospective/issued.json
          if-no-files-found: error
  close:
    needs: issue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.MLSPEND_CLOSE_DATABASE_URL }}
      MLSPEND_SALT: ${{ secrets.MLSPEND_CLOSE_SALT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prospective-issued
          path: results/prospective
      - name: Generate the new simulated outcomes, close and independently verify every score
        run: uv run python -m packages.evaluation.prospective close --issued results/prospective/issued.json --output results/prospective/close.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prospective-close-evidence
          path: results/prospective/
          if-no-files-found: error
  preserve:
    needs: close
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prospective-close-evidence
          path: /tmp/prospective-proof
      - name: Preserve the successful evidence against current main
        run: |
          git fetch origin main
          git switch -c "evidence/prospective-${{ github.run_id }}-${{ github.run_attempt }}" origin/main
          mkdir -p results/prospective
          cp /tmp/prospective-proof/*.json results/prospective/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/prospective/
          git commit -m 'test: preserve prospective forecast issuance and scored simulation'
          git push origin HEAD

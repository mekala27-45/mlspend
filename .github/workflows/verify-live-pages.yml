name: Verify published browser flow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/tests/live.spec.ts', 'web/live.playwright.config.ts', '.github/workflows/verify-live-pages.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Exercise the published frontend and live database path
        working-directory: web
        run: npx playwright test --config live.playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-browser-evidence
          path: web/test-results/live/
          if-no-files-found: error
